<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0e0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estoque">
<title>Estoque LOGARI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{--bg:#0f0e0d;--card:#1a1815;--card2:#221f1b;--ink:#ece4d4;--mut:#9a907c;--line:#2e2a24;--acc:#b8904f;--acc-ink:#15120e;--ok:#8fae6b;--warn:#d6a74a;--bad:#c4553b;--r:12px;--serif:"Playfair Display",Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg)}
body{background:
 repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px),
 repeating-linear-gradient(-45deg,rgba(0,0,0,.25) 0 2px,transparent 2px 6px),
 radial-gradient(ellipse at top,#1d1a16 0%,#0f0e0d 60%);background-attachment:fixed;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:rgba(12,11,10,.96);backdrop-filter:blur(6px);color:var(--ink);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--acc)}
header h1{margin:0;font:800 20px/1 var(--serif);letter-spacing:4px;text-transform:uppercase;color:var(--acc)}
header small{color:var(--mut);font-size:11px;letter-spacing:.5px}
main{padding:14px 12px 100px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#0c0b0a;border-top:1px solid var(--acc);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav button.on{color:var(--acc)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1.2px}
.big{font:800 30px/1.1 var(--serif);letter-spacing:-.3px;color:var(--ink)}
.mid{font:700 19px/1.2 var(--serif)}
.mut{color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;background:#2a2620;border-radius:4px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a6a35,var(--acc))}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:3px;background:#2a2620;color:var(--mut);font-weight:600;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:#3c4a2e}.pill.warn{color:var(--warn);border-color:#5a4724}.pill.bad{color:var(--bad);border-color:#5a2a20}.pill.pe{color:#c9b892;border-color:#4a4233}
.item{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;font:inherit;color:inherit}
.item b{font-family:var(--serif);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:6px 12px;font:inherit;font-size:12px;letter-spacing:.4px;white-space:nowrap;color:var(--ink)}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
select,input{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#141210;color:var(--ink);color-scheme:dark}
label{display:block;font-size:11px;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:1px}
.btn{display:block;width:100%;border:1px solid var(--acc);border-radius:8px;padding:14px;font:inherit;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:13px;background:var(--acc);color:var(--acc-ink);margin-top:14px}
.btn.sec{background:transparent;color:var(--acc)}
.btn.wa{background:#1f3b2a;border-color:#2f5a3f;color:#cfe9d6}
.fab{position:fixed;right:16px;bottom:84px;z-index:7;border:1px solid var(--acc);border-radius:30px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700;letter-spacing:.8px;text-transform:uppercase;font-size:13px;padding:14px 20px;box-shadow:0 8px 22px rgba(0,0,0,.6)}
.cores{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cor{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 10px;background:#141210}
.cor span{display:flex;align-items:center;gap:6px;font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:inline-block;flex:none}
.step{display:flex;align-items:center}
.step button{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;background:#221f1b;color:var(--ink);font-size:18px}
.step input{width:40px;border:0;background:transparent;text-align:center;padding:4px;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);border-top:1px solid var(--acc);width:100%;max-width:640px;margin:0 auto;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:18px 14px calc(28px + env(safe-area-inset-bottom))}
.sheet h2{margin:2px 0 8px;font:800 22px/1.2 var(--serif)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
th{font-size:10.5px;color:var(--mut);text-transform:uppercase;font-weight:600;letter-spacing:1px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--acc);color:var(--acc-ink);padding:10px 16px;border-radius:8px;z-index:40;font-size:14px;font-weight:600}
.load{position:fixed;inset:0;background:rgba(10,9,8,.7);z-index:30;display:flex;align-items:center;justify-content:center;font:700 16px var(--serif);letter-spacing:2px;color:var(--acc)}
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:380px;margin:0 auto;text-align:center}
#login h1{font:800 44px/1 var(--serif);letter-spacing:8px;color:var(--acc);margin:0 0 6px}
#login .rule{height:1px;background:linear-gradient(90deg,transparent,var(--acc),transparent);margin:14px 0 22px}
#login input{font-size:26px;text-align:center;letter-spacing:10px}
.alert{border-left:3px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)}
.estq{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.estq div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px;text-align:center}
.estq b{display:block;font:800 22px var(--serif)}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--acc)}
.rolos{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.rolo{display:grid;grid-template-columns:48px 1fr 92px 30px;gap:8px;align-items:center;background:#141210;border:1px solid var(--line);border-radius:8px;padding:6px}
.rolo img{width:48px;height:48px;object-fit:cover;border-radius:6px}
.rolo select,.rolo input{padding:7px 8px;font-size:14px}
.rolo .x{border:0;background:none;color:var(--bad);font-size:20px}
.tot{font:800 26px var(--serif);color:var(--acc)}
#cam{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
#cam video{flex:1;width:100%;object-fit:cover;min-height:0}
#cam .camtop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:linear-gradient(rgba(0,0,0,.7),transparent);color:#fff;font-weight:600}
#cam .camtop button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:1px}
#cam .cambar{background:#0c0b0a;border-top:1px solid var(--acc);padding:10px 12px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
#camthumbs{display:flex;gap:6px;overflow-x:auto;width:100%;min-height:52px}
#camthumbs div{position:relative;flex:none}
#camthumbs img{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
#camthumbs span{position:absolute;left:0;right:0;bottom:0;font-size:10px;text-align:center;background:rgba(0,0,0,.7);color:var(--acc);border-radius:0 0 6px 6px}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid var(--acc);background:#ece4d4;box-shadow:0 0 0 4px #0c0b0a inset}
.shutter:active{transform:scale(.92);background:var(--acc)}
#cam .flash{position:absolute;inset:0;background:#fff;opacity:.7;pointer-events:none;animation:fl .25s forwards}
@keyframes fl{to{opacity:0}}

.st-OK{color:var(--ok);border-color:#3c4a2e}.st-ATENCAO{color:var(--warn);border-color:#5a4724}.st-REPOR{color:#f07a55;border-color:#6a2f20}.st-ZERADO{color:#fff;background:#7a1f1f;border-color:#7a1f1f}.st-FORA{color:var(--mut)}
.skurow{display:grid;grid-template-columns:1fr repeat(4,1fr);gap:6px;align-items:stretch;margin-bottom:8px}
.skurow .nm{display:flex;flex-direction:column;justify-content:center}
.skurow .nm b{font:800 15px var(--serif)}
.cel{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;background:#141210;font-size:12px}
.cel b{display:block;font:800 17px var(--serif)}
.cel.ZERADO{border-color:#7a1f1f;background:#2a1212}.cel.REPOR{border-color:#6a2f20;background:#24150f}.cel.ATENCAO{border-color:#5a4724;background:#211a10}.cel.FORA{opacity:.5}
.cel .pz{font-size:10px;color:var(--acc)}
.hdcores{display:grid;grid-template-columns:1fr repeat(4,1fr);gap:6px;margin:4px 0 6px;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;text-align:center}
.prog{height:6px;background:#2a2620;border-radius:3px;overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;background:var(--ok)}
.bloco{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:#141210}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 10px;color:var(--ink);font:inherit;font-size:13px}
.pills button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.gq{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:center;margin-top:8px}
.gq .h{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;text-align:center}
.gq input{padding:9px;text-align:center;font-weight:700}
.n4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.n4 label,.n6 label{margin:6px 0 3px;font-size:10px}
.n6{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav button{position:relative}nav .bdg{position:absolute;top:4px;left:calc(50% + 6px);background:#b5432c;color:#fff;border-radius:9px;font-size:10px;min-width:17px;padding:1px 4px;font-weight:700;letter-spacing:0}
.sync{font-size:11px;color:var(--mut);margin-left:6px}.sync.on::before{content:'';display:inline-block;width:8px;height:8px;border:2px solid var(--acc);border-right-color:transparent;border-radius:50%;animation:gira .8s linear infinite;margin-right:4px;vertical-align:-1px}
@keyframes gira{to{transform:rotate(360deg)}}
.fila{background:#2a1a10;border:1px solid #6a2f20;color:#f0b48a;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fila button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:6px;padding:7px 10px;font:inherit;font-weight:700;font-size:12px}
.menu{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;color:var(--ink);font:inherit}
.menu b{font:800 18px var(--serif)}.menu .row{align-items:center}
.al{border-left:3px solid var(--line);padding:10px 12px;background:var(--card);border-radius:0 8px 8px 0;margin-bottom:8px}
.al.a3{border-left-color:#d9583a}.al.a2{border-left-color:var(--warn)}.al.a1{border-left-color:var(--ok)}
.al b{display:block;font-size:14px}.al span{font-size:12.5px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:2px;height:90px;margin-top:10px}.bars i{flex:1;background:var(--acc);opacity:.85;border-radius:2px 2px 0 0;min-height:2px}
.bars i.fd{opacity:.45}
.hb{height:6px;background:#2a2620;border-radius:3px;overflow:hidden;margin-top:3px}.hb i{display:block;height:100%;background:var(--acc)}
.tog{border:1px solid var(--line);background:#141210;color:var(--mut);border-radius:6px;padding:7px 10px;font:inherit;font-size:12px;font-weight:700;min-width:74px}
.tog.on{background:#2f4a26;border-color:#3c6a2e;color:#cfe8b8}
.pend{opacity:.6}
.scan{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff}.scan video{width:100%;max-height:70vh;object-fit:cover}.scan .mira{position:absolute;top:28%;left:50%;width:220px;height:220px;margin-left:-110px;border:3px solid var(--acc);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.paper{background:#fff;color:#1b1b1b;border-radius:8px;padding:18px;font-size:13px}.paper h3{margin:0;font:800 22px var(--serif);letter-spacing:2px}.paper h4{margin:16px 0 6px;font:800 14px var(--serif);border-bottom:2px solid #1b1b1b;padding-bottom:3px;text-transform:uppercase;letter-spacing:1px}
.paper table{width:100%;border-collapse:collapse}.paper td,.paper th{border-bottom:1px solid #ddd;padding:5px 4px;color:#1b1b1b;font-size:12.5px}.paper small{color:#666}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px double #1b1b1b;padding-bottom:8px;margin-bottom:12px}
.paper .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.paper .kp div{border:1px solid #ccc;border-radius:6px;padding:8px;text-align:center;display:flex;flex-direction:column}.paper .kp b{font:800 20px var(--serif)}
.paper .ass{display:flex;gap:30px;margin-top:50px}.paper .ass div{flex:1;border-top:1px solid #1b1b1b;text-align:center;padding-top:4px;font-size:12px}
.etq{display:grid;grid-template-columns:1fr 1fr}.lbl{border:1px dashed #999;padding:10px;display:flex;align-items:center;gap:10px;break-inside:avoid}.lbl .qr{width:58%;aspect-ratio:1}.lbl .qr svg{width:100%;height:100%;display:block}.lbl .tx{flex:1;text-align:center;display:flex;flex-direction:column;color:#000}.lbl .tx b{font:800 21px Helvetica,Arial,sans-serif;line-height:1.15}.lbl .tx span{font:800 14px Helvetica,Arial,sans-serif;margin-top:8px}.lbl small{font-size:8px;color:#666;margin-top:12px}@media print{@page{size:A4;margin:10mm}.etq .lbl{height:66mm;padding:3mm}}
.sbox{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:#141210;color:var(--ink);font:inherit;margin-bottom:10px}
@media print{header,nav,.noprint,#modal,.toast,.fila{display:none!important}body{background:#fff!important}main,#view{padding:0!important;margin:0!important}.paper{border-radius:0;padding:0}.tog{display:none}}
.stt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}.stt button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 4px;color:var(--mut);font:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.5px}.stt b{display:block;font:800 22px var(--serif);margin-bottom:2px}
.lin{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;color:var(--ink);font:inherit;font-size:14px;text-align:left}.lin:last-child{border:0}
.er{display:grid;grid-template-columns:78px repeat(4,minmax(0,1fr));align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.er:last-child{border-bottom:0}.er.hd{padding:0 0 6px;border:0;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;text-align:center}
.en{font:800 15px var(--serif)}.ev{text-align:center;font-size:17px;font-weight:600}.ev.s-ZERADO,.ev.s-REPOR{color:#f07a55;font-weight:800}.ev.s-ATENCAO{color:var(--warn)}.ev.s-FORA{opacity:.45}
.ib{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--acc);font:inherit;font-size:16px;padding:0 12px;height:42px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mi{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 8px 14px;text-align:center;color:var(--ink);font:inherit}.mi i{display:block;font-style:normal;font-size:24px;margin-bottom:6px}.mi b{font-size:13.5px;font-weight:600}.mi .bd{position:absolute;top:7px;right:8px;background:#b5432c;color:#fff;border-radius:9px;font-size:10.5px;padding:1px 6px;font-weight:700}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.mnav button{background:none;border:1px solid var(--line);color:var(--acc);border-radius:6px;padding:6px 12px;font:inherit;font-size:16px}
</style>
</head>
<body>
<div id="login">
  <h1>ESTOQUE</h1>
  <p class="mut" style="margin:0;letter-spacing:3px;text-transform:uppercase;font-size:11px">Logari · Mooca</p><div class="rule"></div>
  <p class="mut" style="margin:0 0 10px">Digite seu PIN</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
  <button class="btn" onclick="entrar()">Entrar</button>
  <p id="lerr" style="color:var(--bad)"></p>
</div>
<div id="app" style="display:none">
  <header><div><h1>Estoque</h1><small id="sub"></small><span id="sync" class="sync"></span></div><button onclick="carregar(true)" style="background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--acc);font:inherit;font-size:12px">↻ Atualizar</button></header>
  <main id="view"></main>
  <nav>
    <button data-t="painel" onclick="ir('painel')"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg>Painel</button>
    <button data-t="estoque" onclick="ir('estoque')"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/></svg>Estoque</button>
    <button data-t="producao" onclick="ir('producao')"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></svg>Produção</button>
    <button data-t="entregas" onclick="ir('entregas')"><svg viewBox="0 0 24 24"><path d="M3 7h12v10H3zM15 10h4l2 3v4h-6M7 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>Entregas</button>
    <button data-t="mais" onclick="ir('mais')"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Mais<span id="bdg"></span></button>
  </nav>
</div>
<div id="modal"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxjWT6DQ8x0DDpiM90QPeMKbzM9Na9yrV9I9Bj7ushiWNXoiAdPK_FuQ59IovZHwVpDEw/exec';
const CORES=['Preto','Azul','Marrom','Branco'];
const COR_HEX={Preto:'#1d1d1d',Azul:'#1f4fa0',Marrom:'#6b4226',Branco:'#f4f1ea'};
let PIN='',D=null,TAB='painel',FM='Todos',FS='Todos';
const $=s=>document.querySelector(s);
const n0=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const n1=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:1});
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dbr=s=>s&&/^\d{4}-/.test(s)?s.slice(8,10)+'/'+s.slice(5,7):(s||'—');
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stk=s=>{s=String(s||'').toUpperCase();return s.startsWith('ZERADO')?'ZERADO':s.startsWith('REPOR')?'REPOR':s.startsWith('ATEN')?'ATENCAO':s.startsWith('FORA')?'FORA':'OK'};
function store(k,v){try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function getStore(k){try{return localStorage.getItem(k)}catch(e){return null}}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
function loading(on){let e=$('#ld');if(on&&!e){e=document.createElement('div');e.id='ld';e.className='load';e.textContent='Carregando…';document.body.appendChild(e)}if(!on&&e)e.remove()}
async function call(action,p,quiet){if(!quiet)loading(true);try{const r=await fetch(API,{method:'POST',body:JSON.stringify({pin:PIN,action,p:p||{}})});const j=await r.json();if(!j||!j.ok)throw new Error(j?j.erro:'Erro');return j}catch(e){if(/Failed to fetch|NetworkError|Load failed|JSON/.test(e.message))throw new Error('Sem conexão. Tente de novo.');throw e}finally{if(!quiet)loading(false)}}
function sync(on,t){const e=$('#sync');if(e){e.className='sync'+(on?' on':'');e.textContent=t||''}}
const CK=()=>'est_d_'+PIN;
async function entrar(){
  PIN=$('#pin').value.trim();if(!PIN)return;
  const cache=getStore(CK());
  if(cache){try{store('est_pin',PIN);abrir();setD(JSON.parse(cache),true);carregar();return}catch(e){}}
  try{await call('login');store('est_pin',PIN);abrir();carregar()}catch(e){$('#lerr').textContent=e.message;if(/PIN/.test(e.message))store('est_pin')}
}
function abrir(){$('#login').style.display='none';$('#app').style.display='block'}
let CARR=false;
async function carregar(force){
  if(CARR)return;CARR=true;sync(true,force?'atualizando':'');if(!D)loading(true);
  try{const r=await call('dados',{force:!!force},true);setD(r.data);if(force)toast('Atualizado')}
  catch(e){if(/PIN/.test(e.message)){store('est_pin');store(CK());location.reload();return}toast(D?'Sem conexão — mostrando dados salvos':e.message)}
  finally{CARR=false;sync(false);loading(false);processaFila()}
}
function setD(d,doCache){D=d;if(!doCache)store(CK(),JSON.stringify(d));$('#sub').textContent=d.user.nome+' · '+d.atualizado.slice(-5);render()}
// fila de lançamentos: salva na hora no celular e envia por trás
function fila(){try{return JSON.parse(getStore('est_fila')||'[]')}catch(e){return[]}}
function setFila(f){store('est_fila',f.length?JSON.stringify(f):undefined)}
let ENV=false;
async function processaFila(){
  if(ENV)return;let f=fila();if(!f.length){render();return}
  ENV=true;sync(true,'salvando');
  while(f.length){const it=f[0];
    try{const r=await call(it.a,it.p,true);f.shift();setFila(f);toast(r.msg||'Salvo');if(r.data&&!f.length)setD(r.data)}
    catch(e){if(/Sem conexão/.test(e.message)){it.erro='Sem conexão';}else{it.erro=e.message;toast('Erro: '+e.message)}setFila(f);break}}
  ENV=false;sync(false);render();
}
function acao(a,p,otimista){const f=fila();f.push({a,p,t:Date.now()});setFila(f);close_();if(otimista)otimista();toast('Salvando…');render();processaFila()}
function vFila(){const f=fila();if(!f.length)return'';const err=f.find(x=>x.erro);return`<div class="fila"><span>${f.length} lançamento${f.length>1?'s':''} ${err?'não enviado — '+esc(err.erro):'sendo salvo…'}</span>${err?`<span><button onclick="processaFila()">Tentar de novo</button> <button style="background:none;color:#f0b48a;border:1px solid #6a2f20" onclick="if(confirm('Descartar os lançamentos pendentes?')){setFila([]);carregar(true)}">Descartar</button></span>`:''}</div>`}
function ir(t){TAB=t;window.scrollTo(0,0);render()}
const VIEWS={planejar:()=>vPlanejar(),oficinas:()=>vOficinas(),tecido:()=>vTecido(),relatorio:()=>vRelatorio(),etiquetas:()=>vEtiquetas(),usuarios:()=>vUsuarios(),historico:()=>vHistorico(),recibo:()=>vRecibo(),painel:()=>vPainel(),estoque:()=>vEstoque(),producao:()=>vProducao(),entregas:()=>vEntregas(),mais:()=>vMais(),alertas:()=>vAlertas(),vendas:()=>vVendas(),resumo:()=>vResumo(),pagamento:()=>vPagamento()};
const NAVOF={planejar:'mais',oficinas:'mais',tecido:'mais',relatorio:'mais',etiquetas:'mais',usuarios:'mais',historico:'mais',recibo:'mais',alertas:'mais',vendas:'mais',resumo:'mais',pagamento:'mais'};
function render(){if(!D)return;const nt=NAVOF[TAB]||TAB;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===nt));
  const na=alertas().filter(a=>a.n>=3).length;$('#bdg').innerHTML=na?`<span class="bdg">${na}</span>`:'';
  let h='';try{h=VIEWS[TAB]()}catch(e){h='<p class="mut">Erro ao montar a tela: '+esc(e.message)+'</p>'}
  $('#view').innerHTML=vFila()+(NAVOF[TAB]&&TAB!=='recibo'?`<button class="tog noprint" style="margin-bottom:12px" onclick="ir('mais')">‹ Voltar</button>`:'')+h}
function open_(h){$('#modal').innerHTML=`<div class="sheet" onclick="if(event.target===this)close_()"><div>${h}<button class="btn sec" onclick="close_()">Fechar</button></div></div>`}
function close_(){$('#modal').innerHTML=''}
const val=id=>$('#'+id).value;
const num=s=>{s=String(s==null?'':s).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return +s||0};

/* ---------- derivados ---------- */
const ativos=()=>D.estoque.filter(x=>x.ativo);
function grupos(lista){const g={};lista.forEach(x=>{const k=x.modelo+'|'+x.tam;(g[k]=g[k]||{modelo:x.modelo,tam:x.tam,itens:{}}).itens[x.cor]=x});return Object.values(g)}
const tamCurto=t=>(t||'').split(' ')[0];
function sugerePiranha(){
  const cand=ativos().filter(x=>!/goca|biq/i.test(x.modelo)&&x.estoque>0);
  const by={};cand.forEach(x=>{const k=x.modelo+' '+tamCurto(x.tam);const sc=x.estoque/((x.media||0)+0.5);if(!by[k]||sc>by[k].sc)by[k]={sc,x}});
  return Object.values(by).sort((a,b)=>b.sc-a.sc).slice(0,4).map(o=>o.x);
}

/* ---------- PAINEL ---------- */
function vPainel(){
  const A=ativos(),est=A.reduce((s,x)=>s+x.estoque,0),prod=A.reduce((s,x)=>s+x.producao,0),med=A.reduce((s,x)=>s+x.media,0),mes=D.estoque.reduce((s,x)=>s+x.mes,0),dono=D.user.dono;
  const kp=(k,v,sub)=>`<div class="card"><div class="k">${k}</div><div class="mid">${v}</div>${sub?`<div class="mut" style="font-size:12px">${sub}</div>`:''}</div>`;
  const cnt=k=>A.filter(x=>stk(x.status)===k).length;
  let h=`<div class="grid2">${kp('Em estoque',n0(est),'+'+n0(prod)+' na oficina')}${kp('Cobertura',n0(med?est/med:0)+' dias',n0(med)+' por dia')}${kp('Vendas no mês',n0(mes))}${dono?kp('Valor em estoque',brl(D.estoque.reduce((s,x)=>s+(x.valor||0),0))):kp('SKUs ativos',A.length)}</div>
  <div class="stt">${[['ZERADO','Zerados','#f07a55'],['REPOR','Repor','#f07a55'],['ATENCAO','Atenção','var(--warn)'],['OK','OK','var(--ok)']].map(([k,t,c])=>`<button onclick="FS='${k==='OK'?'Todos':'FALTA'}';ir('estoque')"><b style="color:${c}">${cnt(k)}</b>${t}</button>`).join('')}</div>`;
  const urg=A.filter(x=>['ZERADO','REPOR','ATENCAO'].includes(stk(x.status))).sort((a,b)=>(a.dias??-1)-(b.dias??-1));
  h+=`<div class="card"><div class="row sp"><div class="k">O que fazer agora</div>${urg.length>5?`<button class="tog" style="min-width:0;padding:4px 9px" onclick="ir('alertas')">Ver todos (${urg.length})</button>`:''}</div>`;
  h+=urg.length?urg.slice(0,5).map(x=>`<button class="lin" onclick="detSku('${x.sku}')"><span><b>${esc(x.modelo)} ${tamCurto(x.tam)}</b> ${esc(x.cor)}</span><span>${x.sugestao?`<span class="mut" style="font-size:12px">produzir ${n0(x.sugestao)}</span> `:''}<span class="pill st-${stk(x.status)}">${n0(x.estoque)}</span></span></button>`).join(''):'<p class="mut" style="margin:6px 0 0">Tudo OK.</p>';
  h+='</div>';
  const pir=D.estoque.filter(x=>x.piranha),cfg=D.config||{};let prox='';if(cfg.ultimaPiranha&&cfg.cicloPiranha)prox=dbr(addDias(cfg.ultimaPiranha,cfg.cicloPiranha));
  h+=`<button class="lin" style="border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card)" onclick="detPiranha()"><span>🐟 <b>Piranha</b> <span class="mut">${pir.length?pir.map(x=>esc(x.modelo)+' '+tamCurto(x.tam)+' '+esc(x.cor)).join(', '):'nenhuma'}</span></span><span class="mut" style="font-size:12px;white-space:nowrap">${prox?'troca '+prox:''} ›</span></button>`;
  return h;
}
function detPiranha(){const pir=D.estoque.filter(x=>x.piranha);
  open_(`<h2>🐟 Piranha</h2><div class="k">Atuais</div>${pir.map(x=>`<div class="row sp" style="font-size:14px;margin:6px 0"><span>${esc(x.modelo)} ${tamCurto(x.tam)} ${esc(x.cor)}</span><span class="mut">${n0(x.estoque)} est. · ${n1(x.media)}/dia</span></div>`).join('')||'<p class="mut">Nenhuma marcada</p>'}
  <div class="k" style="margin-top:14px">Sugestão para a próxima troca</div>${sugerePiranha().map(x=>`<div class="row sp" style="font-size:14px;margin:6px 0"><span>${esc(x.modelo)} ${tamCurto(x.tam)} ${esc(x.cor)}</span><span class="mut">${n0(x.estoque)} est. · ${n1(x.media)}/dia</span></div>`).join('')}`)}

/* ---------- ESTOQUE ---------- */
function vEstoque(){
  const nf=ativos().filter(x=>['ZERADO','REPOR','ATENCAO'].includes(stk(x.status))).length;
  return `<div class="row" style="gap:6px;margin-bottom:10px"><input class="sbox" style="margin:0;flex:1" placeholder="Buscar" value="${esc(Q)}" oninput="buscaQ(this.value)"><button class="ib" aria-label="Ler etiqueta" onclick="lerQR(v=>{const x=skuPorQR(v);x?detSku(x.sku):toast('Etiqueta não reconhecida')})">📷</button><button class="ib" aria-label="Ajuste" onclick="fAjuste()">±</button></div>
  <div class="chips"><button class="${FS!=='FALTA'?'on':''}" onclick="FS='Todos';render()">Tudo</button><button class="${FS==='FALTA'?'on':''}" onclick="FS='FALTA';render()">Faltando ${nf}</button></div>
  <div class="card" style="padding:10px 12px" id="elist">${listaEstoque()}</div>`;
}
function listaEstoque(){
  const l=filtraQ(D.estoque.filter(x=>(x.ativo||x.estoque>0)&&(FS!=='FALTA'||['ZERADO','REPOR','ATENCAO'].includes(stk(x.status)))));
  if(!l.length)return '<p class="mut" style="margin:4px 0">Nada encontrado.</p>';
  return `<div class="er hd"><span></span>${CORES.map(c=>`<span>${c}</span>`).join('')}</div>`+grupos(l).map(g=>`<div class="er"><span class="en">${esc(g.modelo)} ${tamCurto(g.tam)}</span>${CORES.map(c=>{const x=g.itens[c];return x?`<span class="ev s-${stk(x.status)}" onclick="detSku('${x.sku}')">${n0(x.estoque)}</span>`:'<span class="ev mut">–</span>'}).join('')}</div>`).join('');
}
function detSku(sku){
  const x=D.estoque.find(s=>s.sku===sku);if(!x)return;
  const falta=(D.producao.falta||[]).find(f=>f.nome.toLowerCase()===(x.modelo+' '+tamCurto(x.tam)).toLowerCase());
  open_(`<div class="row sp"><h2>${esc(x.modelo)} ${tamCurto(x.tam)} ${esc(x.cor)}</h2><span class="pill st-${stk(x.status)}">${esc(x.status)}</span></div><p class="mut" style="margin:0">${esc(x.sku)}${x.piranha?' · 🐟 Piranha':''}</p>
  <div class="card" style="margin-top:12px"><table>
  <tr><td>Estoque pronto</td><td><b>${n0(x.estoque)}</b></td></tr>
  <tr><td>Na oficina (produção)</td><td>${n0(x.producao)}</td></tr>
  ${falta&&falta.cores[x.cor]!=null?`<tr><td>Falta chegar (lote aberto)</td><td>${n0(falta.cores[x.cor])}</td></tr>`:''}
  <tr><td>Vendas 15 dias</td><td>${n0(x.v15)}</td></tr>
  <tr><td>Média por dia</td><td>${n1(x.media)} · ${esc(x.tend)}</td></tr>
  <tr><td>Dias até acabar</td><td>${x.dias==null?'—':n0(x.dias)}</td></tr>
  <tr><td>Acaba em</td><td>${dbr(x.acaba)}</td></tr>
  <tr><td>Começar produção até</td><td>${dbr(x.comecar)}</td></tr>
  <tr><td>Sugestão produzir</td><td>${x.sugestao?n0(x.sugestao)+' pçs':'—'}</td></tr>
  <tr><td>Vendas no mês</td><td>${n0(x.mes)}</td></tr>
  ${D.user.dono&&x.valor!=null?`<tr><td>Valor em estoque (custo)</td><td>${brl(x.valor)}</td></tr>`:''}
  </table></div><button class="btn sec" onclick="fAjuste('${x.sku}')">± Ajustar este SKU</button>`);
}

/* ---------- PRODUÇÃO ---------- */
let PX={};
function vProducao(){
  const P=D.producao,dono=D.user.dono;
  let h=P.resumo?`<div class="card"><b style="font-family:var(--serif)">${esc(P.resumo)}</b></div>`:'';
  h+=`<button class="btn" style="margin:0 0 12px" onclick="fLote()">+ Novo lote de corte</button>`;
  P.lotes.slice().reverse().forEach(l=>{
    const ch=l.totalCortadas?Math.max(0,l.totalCortadas-l.falta):0,pct=l.totalCortadas?ch/l.totalCortadas*100:0;
    h+=`<div class="card ${l.pend?'pend':''}"><div class="row sp"><b style="font:800 22px var(--serif);color:var(--acc)">${esc(l.lote)}</b><span class="pill ${/conclu|ok|✅/i.test(l.situacao)?'ok':'pe'}">${esc(l.situacao||'—')}</span></div>
    <div class="mut" style="font-size:13px">Corte ${dbr(l.data)} · risco ${n1(l.risco)} m${l.mkg?' · '+n1(l.mkg)+' m/kg':''}</div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <div class="row sp" style="font-size:13px"><span>${n0(ch)} de ${n0(l.totalCortadas)} peças chegaram</span><b style="color:${l.falta?'var(--warn)':'var(--ok)'}">falta ${n0(l.falta)}</b></div>${PX[l.lote]?`
    <table style="margin-top:8px"><tr><th></th>${CORES.map(c=>`<th><span class="dot" style="background:${COR_HEX[c]}"></span></th>`).join('')}</tr>
    <tr><td>Rolos</td>${CORES.map(c=>`<td>${n0(l.rolos[c])}</td>`).join('')}</tr>
    <tr><td>Folhas</td>${CORES.map(c=>`<td>${n0(l.folhas[c])}</td>`).join('')}</tr>
    <tr><td>Cortadas</td>${CORES.map(c=>`<td>${n0(l.cortadas[c])}</td>`).join('')}</tr></table>
    <div class="mut" style="font-size:12px;margin-top:6px">Encaixe: ${Object.entries(l.encaixe).map(([k,v])=>v+'× '+k).join(' · ')||'—'}${dono&&l.custoPeca?' · custo/peça '+brl(l.custoPeca):''}</div>`:''}<button class="tog" style="margin-top:10px" onclick="PX['${l.lote}']=!PX['${l.lote}'];render()">${PX[l.lote]?'Menos':'Detalhes'}</button></div>`;
  });
  if(!P.lotes.length)h+='<p class="mut">Nenhum lote lançado.</p>';
  if((P.falta||[]).length){
    const heads=Object.keys(P.falta[0].cores);
    h+=`<div class="k" style="margin:16px 4px 6px">Falta chegar da oficina, por SKU</div><div class="card"><table><tr><th></th>${heads.map(c=>`<th>${COR_HEX[c]?`<span class="dot" style="background:${COR_HEX[c]}"></span>`:esc(c)}</th>`).join('')}</tr>${P.falta.map(f=>`<tr><td>${esc(f.nome)}</td>${heads.map(c=>`<td style="${f.cores[c]?'color:var(--warn);font-weight:700':''}">${n0(f.cores[c])}</td>`).join('')}</tr>`).join('')}</table></div>`;
  }
  return h;
}
function proxLote(){const ns=D.producao.lotes.map(l=>+(/^P(\d+)$/i.exec(l.lote)||[0,0])[1]);return 'P'+((Math.max(0,...ns))+1)}
function fLote(){
  const enc=['Malta R1','Malta R3','Mulc R1','Mulc R3','Ret R1','Ret R3'];
  const box=(id,lab)=>`<div><label>${lab}</label><input id="${id}" inputmode="decimal" placeholder="0"></div>`;
  open_(`<h2>Novo lote de corte</h2>
  <div class="grid2"><div><label>Lote</label><input id="llote" value="${proxLote()}"></div><div><label>Data</label><input id="ldata" type="date" value="${hoje()}"></div></div>
  <label>Comprimento do risco (m)</label><input id="lrisco" inputmode="decimal" placeholder="ex: 9,43">
  <div class="k" style="margin-top:14px">Encaixe no risco (vezes)</div><div class="n6">${enc.map(e=>box('le_'+e.replace(' ','_'),e)).join('')}</div>
  <div class="k" style="margin-top:14px">Rolos por cor</div><div class="n4">${CORES.map(c=>box('lr_'+c,c)).join('')}</div>
  <div class="k" style="margin-top:14px">Folhas enfestadas por cor</div><div class="n4">${CORES.map(c=>box('lf_'+c,c)).join('')}</div>
  <div class="grid2" style="margin-top:6px"><div><label>Kg total (opcional)</label><input id="lkg" inputmode="decimal"></div>${D.user.dono?`<div><label>Valor tecido R$ (opcional)</label><input id="lval" inputmode="decimal"></div>`:''}</div>
  <p class="mut" style="font-size:12px">As peças cortadas, metros e custo a planilha calcula sozinha.</p>
  <button class="btn" onclick="sLote()">Salvar lote</button>`);
}
function sLote(){
  const enc={},rolos={},folhas={};
  ['Malta R1','Malta R3','Mulc R1','Mulc R3','Ret R1','Ret R3'].forEach(e=>{const v=num(val('le_'+e.replace(' ','_')));if(v)enc[e]=v});
  CORES.forEach(c=>{rolos[c]=num(val('lr_'+c));folhas[c]=num(val('lf_'+c))});
  if(!Object.keys(enc).length)return toast('Informe o encaixe no risco');
  if(!Object.values(rolos).some(Boolean))return toast('Informe os rolos');
  const P={lote:val('llote').trim(),data:val('ldata'),risco:num(val('lrisco')),encaixe:enc,rolos,folhas,kg:num(val('lkg')),valorTecido:$('#lval')?num(val('lval')):0};
  acao('novoLote',P,()=>D.producao.lotes.push({lote:P.lote,data:P.data,risco:P.risco,encaixe:enc,rolos,folhas,cortadas:{},totalCortadas:0,falta:0,situacao:'salvando…',pend:true}));
}

/* ---------- ENTREGAS ---------- */
function vEntregas(){
  const E=D.entregas.itens,dono=D.user.dono;
  let h=`<button class="btn" style="margin:0 0 12px" onclick="fEntrega()">+ Lançar entrega da oficina</button>`;
  const by={};E.forEach(e=>{(by[e.data]=by[e.data]||[]).push(e)});
  Object.keys(by).sort().reverse().slice(0,20).forEach(d=>{
    const L=by[d],tb=L.reduce((s,e)=>s+e.boas,0),td=L.reduce((s,e)=>s+e.defeito,0);
    h+=`<div class="card"><div class="row sp"><b style="font:800 17px var(--serif)">${dbr(d)}</b><span><b>${n0(tb)}</b> boas${td?` · <span style="color:var(--bad)">${n0(td)} defeito</span>`:''}${dono?' · '+brl(L.reduce((s,e)=>s+(e.valor||0),0)):''}</span></div>
    <table style="margin-top:6px">${L.map(e=>`<tr class="${e.pend?'pend':''}" ${e.pend||!e.linha?'':`onclick="eEntrega(${e.linha})"`}><td>${esc(e.modelo)} ${tamCurto(e.tam)} <span class="dot" style="background:${COR_HEX[e.cor]||'#888'}"></span> ${esc(e.cor)}${e.lote?' <span class="mut">'+esc(e.lote)+'</span>':''}</td><td>${n0(e.boas)}${e.defeito?` <span style="color:var(--bad)">+${e.defeito}d</span>`:''}</td><td class="mut" style="font-size:11px">${esc(e.oficina)}</td></tr>`).join('')}</table></div>`;
  });
  if(!E.length)h+='<p class="mut">Nenhuma entrega lançada.</p>';
  return h;
}
let BL=[];

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const addDias=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};

// ---------- ALERTAS ----------
function alertas(){
  const L=[],H=hoje(),A=ativos(),dono=D.user.dono,cfg=D.config||{};
  A.forEach(x=>{const k=stk(x.status);if(!['ZERADO','REPOR','ATENCAO'].includes(k))return;
    const atras=x.comecar&&/^\d{4}-/.test(x.comecar)&&x.comecar<H;
    const nm=`${x.modelo} ${tamCurto(x.tam)} ${x.cor}`;
    if(k==='ZERADO')L.push({n:x.producao?2:3,t:`${nm} zerado`,d:x.producao?`${n0(x.producao)} na oficina — cobrar entrega`:`Nada na oficina${x.sugestao?' · produzir '+n0(x.sugestao):''}`,go:`detSku('${x.sku}')`});
    else L.push({n:k==='REPOR'?3:(atras?2:1),t:`${nm}: ${k==='REPOR'?'repor já':'atenção'}`,d:`${n0(x.estoque)} em estoque · ${x.dias==null?'—':n0(x.dias)+' dias'}${x.comecar?` · começar até ${dbr(x.comecar)}${atras?' (passou)':''}`:''}`,go:`detSku('${x.sku}')`});
  });
  const va=(D.painel||{}).vendasAte;if(va){const m=/(\d{2})\/(\d{2})/.exec(va);if(m){const dv=H.slice(0,4)+'-'+m[2]+'-'+m[1];const atr=difDias(H,dv);if(atr>2)L.push({n:2,t:'Vendas desatualizadas',d:`Última venda lançada em ${m[1]}/${m[2]} (${atr} dias). Rode "Executar estoque".`})}}
  if(cfg.ultimaPiranha&&cfg.cicloPiranha){const px=addDias(cfg.ultimaPiranha,cfg.cicloPiranha),f=difDias(px,H);if(f<=2)L.push({n:f<0?2:1,t:'🐟 Troca da Piranha',d:f<0?`Passou do dia (${dbr(px)})`:f===0?'É hoje':`Em ${f} dia${f>1?'s':''} (${dbr(px)})`})}
  D.producao.lotes.forEach(l=>{if(l.pend||!l.falta||!l.data)return;const dd=difDias(H,l.data);if(dd>=15)L.push({n:dd>=25?3:2,t:`Lote ${l.lote} há ${dd} dias na oficina`,d:`Ainda faltam ${n0(l.falta)} de ${n0(l.totalCortadas)} peças`,go:"ir('producao')"})});
  const ini=addDias(H,-7),E=D.entregas.itens.filter(e=>e.data>=ini),b=E.reduce((s,e)=>s+e.boas,0),df=E.reduce((s,e)=>s+e.defeito,0);
  if(b+df>50&&df/(b+df)>0.03)L.push({n:2,t:`Defeito alto: ${n1(df/(b+df)*100)}% na semana`,d:`${n0(df)} com defeito em ${n0(b+df)} peças entregues`,go:"ir('entregas')"});
  if(dono&&D.pagamento)D.pagamento.forEach(bk=>{const fim=fimSemana(bk);(bk.oficinas||[]).forEach(o=>{if(o.pago||!o.apagar)return;L.push({n:fim&&fim<H?3:1,t:`Pagar ${o.oficina}: ${brl(o.apagar)}`,d:`Semana ${bk.periodo}${fim&&fim<H?' — já fechou':''}`,go:"ir('pagamento')"})});
    if(bk.tot.faltaconferir&&fim&&fim<H)L.push({n:2,t:`${n0(bk.tot.faltaconferir)} entrega(s) sem conferir`,d:`Semana ${bk.periodo}`,go:"ir('pagamento')"})});
  return L.sort((a,b)=>b.n-a.n);
}
function vAlertas(){
  const L=alertas();if(!L.length)return '<div class="card"><b>Tudo em ordem.</b><p class="mut" style="margin:4px 0 0">Nenhum alerta agora.</p></div>';
  const g=[[3,'Urgente'],[2,'Importante'],[1,'Fique de olho']];

}

// ---------- VENDAS ----------
let VP=15;
function vendasRange(ini,fim){const V=(D.vendas||{}).linhas||[];return V.filter(r=>r[0]>=ini&&r[0]<=fim)}
function ultimaVenda(){const V=(D.vendas||{}).linhas||[];return V.reduce((m,r)=>r[0]>m?r[0]:m,'')||hoje()}
function vendasPer(n){const fim=ultimaVenda(),ini=addDias(fim,-(n-1)),L=vendasRange(ini,fim);return{ini,fim,L,tot:L.reduce((s,r)=>s+r[2],0)}}
function agrupa(L,f){const o={};L.forEach(r=>{const k=f(r);o[k]=(o[k]||0)+r[2]});return Object.entries(o).sort((a,b)=>b[1]-a[1])}
const skuInfo=s=>((D.vendas||{}).skus||{})[s]||String(s).split('-');
const modeloDe=s=>{const m=String(skuInfo(s)[0]||'');return m.charAt(0).toUpperCase()+m.slice(1).toLowerCase()};
const corDe=s=>{const c=String(skuInfo(s)[2]||'');return c.charAt(0).toUpperCase()+c.slice(1).toLowerCase()};
const nomeSku=s=>{const i=skuInfo(s);return `${modeloDe(s)} ${String(i[1]||'').split(' ')[0]} ${corDe(s)}`};
function barras(L,ini,fim){const by={};L.forEach(r=>by[r[0]]=(by[r[0]]||0)+r[2]);const dias=[];for(let d=ini;d<=fim;d=addDias(d,1))dias.push(d);const mx=Math.max(1,...dias.map(d=>by[d]||0));
  return `<div class="bars">${dias.map(d=>{const w=new Date(d+'T12:00').getDay();return `<i class="${w===0||w===6?'fd':''}" style="height:${(by[d]||0)/mx*100}%" title="${dbr(d)}: ${by[d]||0}"></i>`}).join('')}</div><div class="row sp mut" style="font-size:11px;margin-top:3px"><span>${dbr(ini)}</span><span>${dbr(fim)}</span></div>`}
function ranking(arr,tot,max,fmt){const mx=arr.length?arr[0][1]:1;return arr.slice(0,max||99).map(([k,v],i)=>`<div style="margin:7px 0"><div class="row sp" style="font-size:13.5px"><span>${i+1}º ${esc(fmt?fmt(k):k)}</span><span><b>${n0(v)}</b> <span class="mut">${n1(v/tot*100)}%</span></span></div><div class="hb"><i style="width:${v/mx*100}%"></i></div></div>`).join('')}
function vVendas(){
  const p=vendasPer(VP),ant=vendasRange(addDias(p.ini,-VP),addDias(p.ini,-1)),ta=ant.reduce((s,r)=>s+r[2],0);
  const vr=ta?(p.tot/ta-1)*100:null;
  let h=`<div class="chips">${[7,15,30,60].map(n=>`<button class="${VP===n?'on':''}" onclick="VP=${n};render()">${n} dias</button>`).join('')}</div>
  <div class="grid2"><div class="card"><div class="k">Vendidas</div><div class="big">${n0(p.tot)}</div><div class="mut" style="font-size:12px">${dbr(p.ini)} a ${dbr(p.fim)}</div></div>
  <div class="card"><div class="k">Média por dia</div><div class="big">${n0(p.tot/VP)}</div><div style="font-size:12px;color:${vr==null?'var(--mut)':vr>=0?'var(--ok)':'#f07a55'}">${vr==null?'sem período anterior':(vr>=0?'▲ ':'▼ ')+n1(Math.abs(vr))+'% vs '+VP+' dias antes'}</div></div></div>
  <div class="card"><div class="k">Por dia</div>${barras(p.L,p.ini,p.fim)}</div>`;
  const pm=agrupa(p.L,r=>modeloDe(r[1])),pc=agrupa(p.L,r=>corDe(r[1]));
  h+=`<div class="grid2"><div class="card"><div class="k">Por modelo</div>${ranking(pm,p.tot)}</div><div class="card"><div class="k">Por cor</div>${ranking(pc,p.tot)}</div></div>`;
  const ps=agrupa(p.L,r=>r[1]);
  h+=`<div class="card"><div class="k">Ranking por SKU</div>${ranking(ps,p.tot,40,nomeSku)}</div>`;
  const zer=ativos().filter(x=>!ps.find(z=>z[0]===x.sku.toUpperCase()));
  if(zer.length)h+=`<div class="card"><div class="k">Sem venda no período</div><div style="font-size:13.5px;margin-top:6px">${zer.map(x=>`${esc(x.modelo)} ${tamCurto(x.tam)} ${esc(x.cor)} <span class="mut">(${n0(x.estoque)} est.)</span>`).join('<br>')}</div></div>`;
  return h;
}

let PAGX={};

}

let Q='';
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function filtraQ(l){if(!Q.trim())return l;const t=norm(Q).split(/\s+/).filter(Boolean);return l.filter(x=>{const h=norm([x.sku,x.modelo,x.tam,x.cor].join(' '));return t.every(w=>h.includes(w))})}
function buscaQ(v){Q=v;const e=$('#elist');if(e)e.innerHTML=listaEstoque()}
let BA=[],AJM='';

  <div class="grid2"><div><label>Data</label><input id="adata" type="date" value="${hoje()}"></div><div><label>Motivo</label><select id="amot" onchange="AJM=this.value;desenhaAj()">${ms.map(m=>`<option ${m===AJM?'selected':''}>${esc(m)}</option>`).join('')}</select></div></div>

  <div id="ablocos"></div>
  <div class="row" style="gap:8px;margin-top:10px"><button class="btn sec" style="margin:0" onclick="BA.push({k:''});desenhaAj()">+ Outro modelo</button><button class="btn sec" style="margin:0;max-width:110px" onclick="lerQR(v=>scanBloco(v,BA,desenhaAj,'aq_'))">📷 Ler</button></div>
  <label>Observação</label><input id="aobs">

}
const ajContagem=()=>/contagem|invent/i.test(AJM),ajSinal=()=>/devol|entrada|sobra/i.test(AJM)?1:-1;
function desenhaAj(){
  const cs=combos(),cont=ajContagem();
  $('#ahint').textContent=cont?'Digite quanto você CONTOU. O app calcula a diferença para o estoque atual.':(ajSinal()>0?'As quantidades ENTRAM no estoque.':'As quantidades SAEM do estoque.');
  $('#ablocos').innerHTML=BA.map((b,i)=>`<div class="bloco"><div class="row sp"><span class="k">Modelo e tamanho</span>${BA.length>1?`<button style="background:none;border:0;color:var(--bad);font-size:18px" onclick="BA.splice(${i},1);desenhaAj()">×</button>`:''}</div>
  <div class="pills" style="margin-top:6px">${cs.map(c=>{const k=c.modelo+'|'+c.tam;return `<button class="${b.k===k?'on':''}" onclick="BA[${i}].k='${k}';desenhaAj()">${esc(c.modelo)} ${tamCurto(c.tam)}</button>`}).join('')}</div>
  ${b.k?`<div class="gq"><span class="h">Cor</span><span class="h">${cont?'Contado':'Qtd'}</span><span class="h">${cont?'Diferença':'Atual'}</span>${CORES.map(c=>{const x=skuDe(b.k,c),at=x?x.estoque:0,q=(b.q||{})[c];return `<span><span class="dot" style="background:${COR_HEX[c]}"></span> ${c}</span><input id="aq_${i}_${c}" inputmode="numeric" placeholder="${cont?n0(at):'0'}" value="${q==null?'':q}" oninput="guardaAj(${i})"><span id="ad_${i}_${c}" style="text-align:center;font-weight:700">${cont?difTxt(q,at):n0(at)}</span>`}).join('')}</div>`:''}</div>`).join('');
  somaAj();
}
const skuDe=(k,c)=>{const[m,t]=k.split('|');return D.estoque.find(x=>x.modelo===m&&x.tam===t&&x.cor===c)};
const difTxt=(q,at)=>q==null||q===''?'—':(q-at>0?'+':'')+n0(q-at);
function guardaAj(i){const b=BA[i];b.q={};CORES.forEach(c=>{const s=val('aq_'+i+'_'+c);b.q[c]=s===''?null:num(s);if(ajContagem()){const x=skuDe(b.k,c),e=$('#ad_'+i+'_'+c);if(e)e.textContent=difTxt(b.q[c],x?x.estoque:0)}});somaAj()}
function itensAj(){const out=[],cont=ajContagem(),sg=ajSinal();BA.forEach(b=>{if(!b.k)return;const[modelo,tam]=b.k.split('|');CORES.forEach(c=>{const q=(b.q||{})[c];if(q==null||q==='')return;const x=skuDe(b.k,c),at=x?x.estoque:0;const d=cont?q-at:sg*Math.abs(q);if(d)out.push({modelo,tam,cor:c,qtd:d,obs:cont?`contado ${q}, tinha ${at}`:''})})});return out}
function somaAj(){const t=itensAj().reduce((s,i)=>s+i.qtd,0),e=$('#atot');if(e)e.textContent=(t>0?'+':'')+n0(t)+' peças'}
function sAjuste(){const itens=itensAj();if(!itens.length)return toast('Nada para ajustar');const t=itens.reduce((s,i)=>s+i.qtd,0);
  if(!confirm(`Lançar ajuste "${AJM}" de ${t>0?'+':''}${t} peças em ${itens.length} SKU(s)?`))return;
  const P={data:val('adata'),motivo:AJM,obs:val('aobs'),itens};
  acao('novoAjuste',P,()=>itens.forEach(i=>{const x=skuDe(i.modelo+'|'+i.tam,i.cor);if(x)x.estoque+=i.qtd}))}

// ---------- PLANEJAR: previsão + plano de corte ----------
let PA=20;
// peças que cada rolo rende, por modelo (informado pelo Manuel; o lote P1 confirmou ~120/rolo no mix Malta)
const RENDE={Mulc:160,Malta:120,Ret:120};
function fpr(){let f=0,r=0;D.producao.lotes.forEach(l=>CORES.forEach(c=>{if(l.rolos[c]&&l.folhas[c]){f+=l.folhas[c];r+=l.rolos[c]}}));return r?f/r:6}
function encaixeFam(){const o={};D.producao.lotes.slice().reverse().forEach(l=>Object.entries(l.encaixe||{}).forEach(([k,n])=>{const f=k.split(' ')[0];if(!o[f])o[f]={lote:l.lote,enc:{}};if(o[f].lote===l.lote)o[f].enc[k]=n}));return o}
function tecidoDe(cor){const t=D.tecido;if(!t)return null;const m=(t.comprar||[]).find(x=>norm(x.peca)===norm(cor));const nome=m?m.tecido:cor;return {nome,rolos:(t.saldo||{})[nome]??null}}
function planoCorte(){
  const need=x=>Math.max(0,Math.round(x.media*PA-x.estoque-x.producao));
  let pc=0,rl=0;D.producao.lotes.forEach(l=>{const r=CORES.reduce((s,c)=>s+(l.rolos[c]||0),0);if(r&&l.totalCortadas){pc+=l.totalCortadas;rl+=r}});const ppr=rl?pc/rl:120;
  const g={};ativos().forEach(x=>{const n=need(x);if(!n)return;const k=x.modelo+' '+tamCurto(x.tam);(g[k]=g[k]||{nome:k,cores:{}}).cores[x.cor]=n});
  const sem={};
  const cores=CORES.map(c=>{let n=0,r=0;Object.values(g).forEach(o=>{const q=o.cores[c]||0;if(!q)return;n+=q;const m=o.nome.split(' ')[0];if(RENDE[m])r+=q/RENDE[m];else sem[m]=(sem[m]||0)+q});return{cor:c,need:n,exato:r,rolos:r>0.15?Math.ceil(r-0.15):0,tec:tecidoDe(c)}});
  return{grid:Object.values(g),cores,ppr,sem,rolos:cores.reduce((s,c)=>s+c.rolos,0)};
}
function vPlanejar(){
  let h=`<div class="chips"><span class="mut" style="font-size:12px;align-self:center">Cobrir</span>${[15,20,30,45].map(n=>`<button class="${PA===n?'on':''}" onclick="PA=${n};render()">${n} dias</button>`).join('')}</div>`;
  const P=planoCorte(),tp=P.cores.reduce((s,c)=>s+c.need,0);
  h+=`<div class="card" style="border-color:var(--acc)"><div class="k">Colocar para descansar</div><div class="big">${n0(P.rolos)} rolos</div><div class="mut" style="font-size:12px">Para cobrir ${PA} dias de venda · já desconta estoque e o que está na oficina · ${n0(tp)} peças</div>
  <div class="grid2" style="margin-top:10px">${P.cores.filter(c=>c.rolos).map(c=>{const t=c.tec,ok=t&&t.rolos!=null?t.rolos>=c.rolos:null;return `<div style="border:1px solid var(--line);border-radius:6px;padding:8px"><div><span class="dot" style="background:${COR_HEX[c.cor]}"></span> ${c.cor}</div><div style="font:800 22px var(--serif)">${c.rolos}</div>${t&&t.rolos!=null?`<div style="font-size:11.5px;color:${ok?'var(--ok)':'#f07a55'}">${ok?'tem '+n0(t.rolos):'falta '+n0(c.rolos-t.rolos)} ${esc(t.nome)}</div>`:''}</div>`}).join('')||'<span class="mut">Nada precisa descansar agora.</span>'}</div>
  <div class="mut" style="font-size:11.5px;margin-top:8px">Rende por rolo: ${Object.entries(RENDE).map(([m,n])=>m+' '+n).join(' · ')} peças${Object.keys(P.sem).length?` · <span style="color:var(--warn)">sem rendimento: ${Object.entries(P.sem).map(([m,n])=>m+' ('+n0(n)+' peças)').join(', ')}</span>`:''}</div></div>`;
  if(!tp)return h+'<p class="mut">Nada para cortar nesse horizonte.</p>'+previsao();
  h+=`<div class="card"><div class="k">Por cor</div><table style="margin-top:6px"><tr><th style="text-align:left">Cor</th><th>Peças</th><th>Rolos</th><th>Tecido</th></tr>${P.cores.filter(c=>c.need).map(c=>{const t=c.tec,ok=t&&t.rolos!=null?t.rolos>=c.rolos:null;return `<tr><td><span class="dot" style="background:${COR_HEX[c.cor]}"></span> ${c.cor}</td><td>${n0(c.need)}</td><td><b>${c.rolos}</b></td><td style="font-size:12px;color:${ok===null?'var(--mut)':ok?'var(--ok)':'#f07a55'}">${t&&t.rolos!=null?(ok?'tem '+t.rolos:'falta '+(c.rolos-t.rolos))+' <span class="mut">'+esc(t.nome)+'</span>':'—'}</td></tr>`}).join('')}</table></div>
  <div class="card"><div class="k">Peças por modelo</div><table style="margin-top:6px"><tr><th></th>${CORES.map(c=>`<th><span class="dot" style="background:${COR_HEX[c]}"></span></th>`).join('')}<th>Total</th></tr>${P.grid.map(o=>`<tr><td>${esc(o.nome)}</td>${CORES.map(c=>`<td style="${o.cores[c]?'font-weight:700':''}">${o.cores[c]?n0(o.cores[c]):'—'}</td>`).join('')}<td><b>${n0(CORES.reduce((s,c)=>s+(o.cores[c]||0),0))}</b></td></tr>`).join('')}</table></div>`;
  return h+previsao();
}
function previsao(){

function fTecido(){const L=(D.tecido&&D.tecido.listas)||{},sel=(id,a,ph)=>a&&a.length?`<select id="${id}">${a.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:`<input id="${id}" placeholder="${ph||''}">`;
  const tipos=(L.tipo||[]).length?L.tipo:['Chegada','Contagem','Ajuste'];
  open_(`<h2>Lançar tecido</h2><div class="grid2"><div><label>Data</label><input id="tdata" type="date" value="${hoje()}"></div><div><label>Tipo</label>${sel('ttipo',tipos)}</div>
  <div><label>Local</label>${sel('tloc',L.local)}</div><div><label>Cortador</label>${sel('tcort',L.cortador)}</div>
  <div><label>Cor do tecido</label>${sel('tcor',L.cor,'ex: Preto')}</div><div><label>Rolos (+ entra, − sai)</label><input id="trol" inputmode="decimal" placeholder="ex: 10"></div>
  <div><label>Kilos (opcional)</label><input id="tkg" inputmode="decimal"></div>${D.user.dono?`<div><label>Valor R$ (opcional)</label><input id="tval" inputmode="decimal"></div>`:'<div></div>'}</div>
  <label>Observação</label><input id="tobs" placeholder="ex: NF 1234"><button class="btn" onclick="sTecido()">Salvar</button>`)}
function sTecido(){const rol=num(val('trol'));if(!rol)return toast('Informe os rolos');const P={data:val('tdata'),tipo:val('ttipo'),local:val('tloc'),cortador:val('tcort'),cor:val('tcor'),rolos:rol,kg:num(val('tkg')),valor:$('#tval')?num(val('tval')):0,obs:val('tobs')};
  acao('novoTecido',P,()=>{const T=D.tecido;if(T){T.movs.unshift(Object.assign({},P));T.saldo[P.cor]=(T.saldo[P.cor]||0)+rol;T.totalRolos=(T.totalRolos||0)+rol}})}

// ---------- USUÁRIOS + HISTÓRICO (dono) ----------
function vUsuarios(){if(!D.user.dono)return '<p class="mut">Sem acesso.</p>';
  return `<button class="btn" style="margin:0 0 12px" onclick="fUsuario()">+ Nova pessoa</button>`+(D.usuarios||[]).map(u=>`<div class="card"><div class="row sp"><span><b style="font:800 17px var(--serif)">${esc(u.nome)}</b><div class="mut" style="font-size:12px">${u.perfil==='dono'?'Dono — vê tudo':'Equipe — sem custos e pagamentos'}</div></span><span><button class="tog" onclick="this.textContent='${esc(u.pin)}'">PIN ••••</button> <button class="tog" style="min-width:0" onclick="fUsuario(${u.linha})">Editar</button></span></div></div>`).join('')}
function fUsuario(linha){const u=(D.usuarios||[]).find(x=>x.linha===linha)||{nome:'',pin:'',perfil:'equipe'};
  open_(`<h2>${linha?'Editar':'Nova'} pessoa</h2><label>Nome</label><input id="un" value="${esc(u.nome)}"><label>PIN (4 a 8 números)</label><input id="up" inputmode="numeric" value="${esc(u.pin)}">
  <label>Perfil</label><select id="upf"><option value="equipe" ${u.perfil!=='dono'?'selected':''}>Equipe</option><option value="dono" ${u.perfil==='dono'?'selected':''}>Dono</option></select>
  <button class="btn" onclick="acao('salvarUsuario',{linha:${linha||0},nome:val('un'),pin:val('up'),perfil:val('upf')})">Salvar</button>
  ${linha?`<button class="btn sec" style="color:var(--bad)" onclick="if(confirm('Remover ${esc(u.nome)}? O PIN para de funcionar.'))acao('removerUsuario',{linha:${linha}})">Remover</button>`:''}`)}
let HU='';
function vHistorico(){if(!D.user.dono)return '<p class="mut">Sem acesso.</p>';const L=D.log||[],us=[...new Set(L.map(x=>x[1]))];
  const f=L.filter(x=>!HU||x[1]===HU);
  return `<div class="chips"><button class="${!HU?'on':''}" onclick="HU='';render()">Todos</button>${us.map(u=>`<button class="${HU===u?'on':''}" onclick="HU='${esc(u)}';render()">${esc(u)}</button>`).join('')}</div>`+
  (f.length?f.map(x=>`<div class="al"><b>${esc(x[2])} <span class="mut" style="font-weight:400">· ${esc(x[1])}</span></b><span>${dbr(x[0].slice(0,10))} ${x[0].slice(11)} — ${esc(x[3])}</span></div>`).join(''):'<p class="mut">Nada registrado ainda. A partir de agora todo lançamento feito pelo app aparece aqui.</p>')}


// ---------- QR: leitor e etiquetas ----------
function carregaJS(src){return new Promise((ok,er)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>er(new Error('Sem internet para carregar o leitor'));document.head.appendChild(s)})}
let QRS=null;
async function lerQR(cb){
  const ov=document.createElement('div');ov.className='scan';ov.innerHTML=`<video playsinline muted></video><div class="mira"></div><p>Aponte para a etiqueta QR</p><button class="btn sec" style="max-width:220px">Cancelar</button>`;document.body.appendChild(ov);
  const vd=ov.querySelector('video');let parar=false,stream=null;
  const fim=v=>{parar=true;if(stream)stream.getTracks().forEach(t=>t.stop());ov.remove();if(v)cb(v)};
  ov.querySelector('button').onclick=()=>fim();
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});vd.srcObject=stream;await vd.play()}catch(e){fim();return toast('Não consegui abrir a câmera')}
  let det=null;if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){}}
  if(!det){try{await carregaJS('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js')}catch(e){fim();return toast(e.message)}}
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const loop=async()=>{if(parar)return;try{if(det){const r=await det.detect(vd);if(r[0])return fim(r[0].rawValue)}else if(vd.videoWidth){cv.width=vd.videoWidth;cv.height=vd.videoHeight;cx.drawImage(vd,0,0);const im=cx.getImageData(0,0,cv.width,cv.height);const r=jsQR(im.data,im.width,im.height);if(r&&r.data)return fim(r.data)}}catch(e){}setTimeout(loop,180)};loop();
}
const skuPorQR=v=>{v=String(v||'').trim().toUpperCase().replace(/^SKU[:\s]{0,3}/,'');return D.estoque.find(x=>x.sku.toUpperCase()===v)};
function scanBloco(v,arr,redesenha,pref){const x=skuPorQR(v);if(!x)return toast('Etiqueta não reconhecida: '+v);const k=x.modelo+'|'+x.tam;let i=arr.findIndex(b=>b.k===k);if(i<0){i=arr.findIndex(b=>!b.k);if(i<0){arr.push({k});i=arr.length-1}else arr[i].k=k}redesenha();toast(`${x.modelo} ${tamCurto(x.tam)} ${x.cor}`);setTimeout(()=>{const e=$('#'+pref+i+'_'+x.cor);if(e){e.focus();e.scrollIntoView({block:'center'})}},50)}
let EQM='Todos';
function vEtiquetas(){
  const base=D.estoque.filter(x=>x.ativo||x.estoque>0),mods=['Todos',...new Set(base.map(x=>x.modelo))],L=base.filter(x=>EQM==='Todos'||x.modelo===EQM);
  setTimeout(desenhaQRs,30);
  return `<div class="noprint"><div class="chips">${mods.map(m=>`<button class="${EQM===m?'on':''}" onclick="EQM='${m}';render()">${m}</button>`).join('')}</div>
  <button class="btn" style="margin:0 0 12px" onclick="window.print()">🖨 Imprimir / salvar PDF</button><p class="mut" style="font-size:12px">Cole a etiqueta no saco ou na prateleira. No app, o botão 📷 lê a etiqueta e já escolhe o modelo, o tamanho e a cor.</p></div>
  <div class="paper etq">${L.map(x=>`<div class="lbl"><div class="qr" data-v="${esc(x.sku)}"></div><div class="tx"><b>${esc(x.modelo)}</b><b>${tamCurto(x.tam)}</b><span>${esc(x.cor).toUpperCase()}</span><small>${esc(x.sku)}</small></div></div>`).join('')}</div>`}
async function desenhaQRs(){const els=document.querySelectorAll('.qr[data-v]');if(!els.length)return;try{await carregaJS('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js')}catch(e){return toast(e.message)}
  els.forEach(e=>{const q=qrcode(0,'M');q.addData(e.dataset.v);q.make();e.innerHTML=q.createSvgTag({cellSize:4,margin:1,scalable:true})})}

// ---------- RELATÓRIO (PDF) ----------
let RP='mes';
function periodoRel(){const H=hoje(),d=new Date(H+'T12:00'),dow=(d.getDay()+6)%7,seg=addDias(H,-dow);
  if(RP==='semana')return[seg,H,'Esta semana'];if(RP==='semanaant')return[addDias(seg,-7),addDias(seg,-1),'Semana passada'];
  if(RP==='mesant'){const p=new Date(d.getFullYear(),d.getMonth()-1,1),i=p.toISOString().slice(0,10).slice(0,7)+'-01';return[i,addDias(H.slice(0,7)+'-01',-1),nomeMes(i.slice(0,7))]}
  return[H.slice(0,7)+'-01',H,nomeMes(H.slice(0,7))]}
function vRelatorio(){
  const[ini,fim,nome]=periodoRel(),dono=D.user.dono,L=vendasRange(ini,fim),tot=L.reduce((s,r)=>s+r[2],0),nd=Math.max(1,new Set(L.map(r=>r[0])).size);
  const E=D.entregas.itens.filter(e=>e.data>=ini&&e.data<=fim&&!e.pend),eb=E.reduce((s,e)=>s+e.boas,0),ed=E.reduce((s,e)=>s+e.defeito,0),ev=E.reduce((s,e)=>s+(e.valor||0),0);
  const lotes=D.producao.lotes.filter(l=>l.data>=ini&&l.data<=fim),ps=agrupa(L,r=>r[1]),pm=agrupa(L,r=>modeloDe(r[1]));
  const A=ativos(),cnt=k=>A.filter(x=>stk(x.status)===k).length,est=A.reduce((s,x)=>s+x.estoque,0);
  const al=alertas().filter(a=>a.n>=2).slice(0,10);
  const tr=(a,b)=>`<tr><td>${a}</td><td style="text-align:right">${b}</td></tr>`;
  let h=`<div class="noprint"><div class="chips">${[['semana','Esta semana'],['semanaant','Semana passada'],['mes','Este mês'],['mesant','Mês passado']].map(([k,t])=>`<button class="${RP===k?'on':''}" onclick="RP='${k}';render()">${t}</button>`).join('')}</div>
  <button class="btn" style="margin:0 0 12px" onclick="window.print()">📄 Salvar PDF / Imprimir</button><p class="mut" style="font-size:12px">No celular: toque em Salvar PDF e escolha "Salvar como PDF" na impressora. Depois é só mandar pelo WhatsApp.</p></div>
  <div class="paper"><div class="ph"><div><h3>LOGARI</h3><small>Relatório de estoque e produção</small></div><div style="text-align:right"><b>${esc(nome)}</b><br><small>${dbr(ini)} a ${dbr(fim)} · gerado ${D.atualizado}</small></div></div>
  <div class="kp"><div><small>Vendidas</small><b>${n0(tot)}</b><small>${n0(tot/nd)}/dia</small></div><div><small>Entregues oficina</small><b>${n0(eb)}</b><small>${eb+ed?n1(ed/(eb+ed)*100):0}% defeito</small></div><div><small>Cortadas</small><b>${n0(lotes.reduce((s,l)=>s+(l.totalCortadas||0),0))}</b><small>${lotes.length} lote(s)</small></div><div><small>Estoque hoje</small><b>${n0(est)}</b><small>${cnt('ZERADO')} zerados · ${cnt('REPOR')} repor</small></div></div>
  <h4>Vendas por modelo</h4><table>${pm.map(([m,q])=>tr(esc(m),n0(q)+' <small>('+n1(q/(tot||1)*100)+'%)</small>')).join('')||tr('—','')}</table>
  <h4>Top 10 SKUs</h4><table>${ps.slice(0,10).map(([k,q],i)=>tr((i+1)+'º '+esc(nomeSku(k)),n0(q))).join('')||tr('—','')}</table>
  <h4>Estoque por situação</h4><table>${tr('Zerados',cnt('ZERADO'))}${tr('Repor já',cnt('REPOR'))}${tr('Atenção',cnt('ATENCAO'))}${tr('OK',cnt('OK'))}${tr('Na oficina (peças)',n0(A.reduce((s,x)=>s+x.producao,0)))}</table>
  ${dono?`<h4>Financeiro</h4><table>${tr('Custo de costura no período',brl(ev))}${tr('Custo médio por peça',eb?brl(ev/eb):'—')}${tr('Valor do estoque (custo)',brl(D.estoque.reduce((s,x)=>s+(x.valor||0),0)))}${D.pagamento?tr('Pagamentos de oficina em aberto',brl(pagAberto())):''}</table>`:''}
  ${al.length?`<h4>Pontos de atenção</h4><table>${al.map(a=>tr(esc(a.t),'<small>'+esc(a.d)+'</small>')).join('')}</table>`:''}</div>`;
  return h;
}


// ---------- RECIBO DA OFICINA ----------
let RCB=null;
function abreRecibo(i,j){RCB={i,j};ir('recibo')}
function vRecibo(){
  if(!RCB||!D.pagamento||!D.pagamento[RCB.i])return '<p class="mut">Escolha uma oficina em Pagamento.</p>';
  const b=D.pagamento[RCB.i],o=b.oficinas[RCB.j],E=b.entregas.filter(e=>norm(e.oficina)===norm(o.oficina));
  const txt=`*Recibo LOGARI — ${o.oficina}*\nSemana ${b.periodo}\n\n${E.map(e=>`${dbr(e.data)} · ${e.modelo} · ${n0(e.qtd)} pçs × ${brl(e.valor)} = ${brl(e.qtd*e.valor)}${e.vale?' (vale '+brl(e.vale)+')':''}`).join('\n')}\n\nTotal: ${n0(o.pecas)} peças · ${brl(o.bruto)}\nVales: ${brl(o.vales)}\n*A pagar: ${brl(o.apagar)}*${o.pago?'\n✅ PAGO':''}`;
  return `<div class="noprint"><button class="tog" style="margin-bottom:12px" onclick="ir('pagamento')">‹ Pagamento</button>
  <div class="grid2"><button class="btn" style="margin:0" onclick="window.print()">📄 PDF</button><a class="btn" style="margin:0;text-align:center;text-decoration:none;background:#25d366;color:#08240f" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank">WhatsApp</a></div><p></p></div>
  <div class="paper"><div class="ph"><div><h3>LOGARI</h3><small>Recibo de serviço de costura</small></div><div style="text-align:right"><b>${esc(o.oficina)}</b><br><small>Semana ${esc(b.periodo)}</small></div></div>
  <table><tr><th style="text-align:left">Data</th><th style="text-align:left">Modelo</th><th>Peças</th><th>R$/pç</th><th>Total</th><th>Vale</th></tr>
  ${E.map(e=>`<tr><td>${dbr(e.data)}</td><td>${esc(e.modelo)}</td><td style="text-align:right">${n0(e.qtd)}</td><td style="text-align:right">${brl(e.valor)}</td><td style="text-align:right">${brl(e.qtd*e.valor)}</td><td style="text-align:right">${e.vale?brl(e.vale):'—'}</td></tr>`).join('')}</table>
  <table style="margin-top:12px">${[['Total de peças',n0(o.pecas)],['Valor bruto',brl(o.bruto)],['Vales já pagos',brl(o.vales)]].map(([a,v])=>`<tr><td>${a}</td><td style="text-align:right">${v}</td></tr>`).join('')}<tr><td><b>A pagar</b></td><td style="text-align:right"><b style="font-size:18px">${brl(o.apagar)}</b></td></tr></table>
  ${o.pago?'<p style="text-align:center;font-weight:800;color:#2f6a26;margin-top:14px">✓ PAGO</p>':''}
  <div class="ass"><div>LOGARI</div><div>${esc(o.oficina)}</div></div></div>`;
}
